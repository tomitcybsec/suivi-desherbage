<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi désherbage</title>
<meta name="description" content="Suivi des passages de désherbage par rue et prévision de repousse selon la météo.">
<meta name="theme-color" content="#2f6b3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface2:#eef2ec; --text:#1d2a1f; --muted:#5d6b60; --line:#d8dfd6;
  --brand:#2f6b3a; --brand-ink:#ffffff; --focus:#2f6b3a;
  --retard:#c2362b; --retard-bg:#fbe5e2;
  --semaine:#c76a00; --semaine-bg:#fdeed9;
  --quinzaine:#8a7a00; --quinzaine-bg:#f6f1cf;
  --ok:#2f7d3e; --ok-bg:#e1f2e3;
  --inconnu:#6b7280; --inconnu-bg:#eceef0;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121612; --surface:#1b211c; --surface2:#232b24; --text:#e4ebe4; --muted:#9aa89c; --line:#313b32;
    --brand:#5fae6c; --brand-ink:#0e1a10; --focus:#7cc489;
    --retard:#ff8a7e; --retard-bg:#3a1f1c;
    --semaine:#ffb357; --semaine-bg:#3a2a14;
    --quinzaine:#e6d35a; --quinzaine-bg:#33301a;
    --ok:#7cd08a; --ok-bg:#1c3320;
    --inconnu:#a3a9b3; --inconnu-bg:#2a2e33;
    --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

header.top{background:var(--brand);color:var(--brand-ink);padding:12px 0 0;position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.top select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:4px 8px}
.top select option{color:#111}
.pill{margin-left:auto;font-size:12.5px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.pill.warn{background:#ffd54a;color:#2a2200;border-color:#ffd54a}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:inherit;opacity:.8;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:currentColor;font-weight:600}

main{padding:16px 0 96px}
h2{font-size:17px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.notice{background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.notice.warn{background:var(--semaine-bg);border-color:transparent}

.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border-radius:var(--radius);padding:10px 12px;border:0;text-align:left;cursor:pointer;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.tile b{display:block;font-size:24px;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.retard b{color:var(--retard)} .tile.semaine b{color:var(--semaine)} .tile.quinzaine b{color:var(--quinzaine)} .tile.ok b{color:var(--ok)} .tile.inconnu b{color:var(--inconnu)}

.meteo{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.meteo div{min-width:110px}
.meteo b{display:block;font-size:17px}

.list{display:flex;flex-direction:column;gap:8px}
.rue{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.rue:hover{border-color:var(--brand)}
.rue .main{flex:1;min-width:0}
.rue .nom{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.rue .meta{font-size:12.5px;color:var(--muted)}
.rue .right{text-align:right;font-size:12.5px;white-space:nowrap}
.rue input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--brand)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.chip.retard{color:var(--retard);background:var(--retard-bg)} .chip.semaine{color:var(--semaine);background:var(--semaine-bg)}
.chip.quinzaine{color:var(--quinzaine);background:var(--quinzaine-bg)} .chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.inconnu{color:var(--inconnu);background:var(--inconnu-bg)}
.classe{display:inline-block;min-width:22px;text-align:center;font-size:12px;font-weight:700;border-radius:6px;padding:1px 5px;background:var(--surface2);border:1px solid var(--line)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.toolbar input[type=search]{flex:1;min-width:180px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.danger{color:var(--retard)}
.btn:disabled{opacity:.5;cursor:default}
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.selbar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.section>summary{cursor:pointer;font-weight:600;font-size:17px;margin:22px 0 10px;list-style-position:inside}

.hist-day{margin-top:16px}
.hist-day h3{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:600}
.hist-item{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.hist-item:first-of-type{border-top-left-radius:var(--radius);border-top-right-radius:var(--radius)}
.hist-item:last-child{border-bottom:0;border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius)}
.hist-box{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hist-item .grow{flex:1;min-width:0}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--text);font-size:15px}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.radios input{accent-color:var(--brand);margin-top:3px}
.radios label:has(input:checked){border-color:var(--brand);background:var(--ok-bg)}

dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 8px}
.dlg-head h3{margin:0;font-size:17px;flex:1}
.dlg-body{padding:8px 16px 16px;overflow:auto}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px 16px;border-top:1px solid var(--line)}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.settings-grid{grid-template-columns:repeat(2,1fr)}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2a1f;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.empty{padding:20px;text-align:center;color:var(--muted)}

.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:16;display:flex;align-items:center;gap:8px;background:var(--brand);color:var(--brand-ink);border:0;border-radius:999px;padding:13px 18px 13px 15px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.fab svg,.mic svg{width:20px;height:20px;flex:none}
.fab.haut{bottom:calc(84px + env(safe-area-inset-bottom))}
.mic-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.mic{display:inline-flex;align-items:center;gap:8px}
.mic.ecoute{background:var(--retard);border-color:var(--retard);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--retard-bg)}}
#dictTexte{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;resize:vertical}
.dict-sec{margin-top:14px}
.dict-sec h4{margin:0 0 6px;font-size:14px}
.dict-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--surface);cursor:pointer}
.dict-item input{width:20px;height:20px;accent-color:var(--brand);flex:none}
.dict-item .grow{flex:1;min-width:0}
.dict-ambi{border:1px dashed var(--semaine);border-radius:10px;padding:8px;margin-bottom:8px}
.dict-ambi p{margin:0 0 6px;font-size:13px;color:var(--semaine);font-weight:600}
.dict-non{font-size:13px;color:var(--retard)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1>Suivi désherbage</h1>
      <select id="secteur" aria-label="Secteur"></select>
      <span id="meteoPill" class="pill" role="button" tabindex="0" title="Actualiser la météo">Météo…</span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="priorites" aria-selected="true">Priorités</button>
      <button role="tab" data-tab="rues" aria-selected="false">Rues</button>
      <button role="tab" data-tab="historique" aria-selected="false">Historique</button>
      <button role="tab" data-tab="reglages" aria-selected="false">Réglages</button>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>
<div id="selbar" class="selbar" hidden>
  <div class="wrap">
    <strong id="selCount">0 rue</strong>
    <button class="btn" id="selNone">Tout désélectionner</button>
    <button class="btn primary" id="selGo">Saisir un passage</button>
  </div>
</div>

<dialog id="dlgPassage">
  <form method="dialog" id="formPassage">
    <div class="dlg-head"><h3 id="dpTitre">Passage</h3><button class="x" value="cancel" aria-label="Fermer">×</button></div>
    <div class="dlg-body">
      <p class="muted small" id="dpRues"></p>
      <div class="form-grid">
        <label class="f">Date du passage<input type="date" id="dpDate" required></label>
        <label class="f">Équipe / agents<input type="text" id="dpEquipe" placeholder="ex. Équipe A" autocomplete="off"></label>
      </div>
      <p class="small" style="margin:14px 0 6px"><strong>État constaté en arrivant</strong> <span class="muted">(c'est ce qui permet à l'appli d'apprendre)</span></p>
      <div class="radios">
        <label><input type="radio" name="etat" value="propre"><span><strong>Presque propre</strong><br><span class="muted small">On est passé trop tôt</span></span></label>
        <label><input type="radio" name="etat" value="peu"><span><strong>Un peu d'herbe</strong><br><span class="muted small">C'était le bon moment</span></span></label>
        <label><input type="radio" name="etat" value="beaucoup"><span><strong>Beaucoup d'herbe</strong><br><span class="muted small">On est passé trop tard</span></span></label>
        <label><input type="radio" name="etat" value="" checked><span>Non renseigné</span></label>
      </div>
      <label class="f" style="margin-top:12px">Remarque<textarea id="dpRemarque" rows="2" placeholder="facultatif"></textarea></label>
    </div>
    <div class="dlg-foot">
      <button class="btn" value="cancel" formnovalidate>Annuler</button>
      <button class="btn primary" value="ok" id="dpOk">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="dlgRue">
  <div class="dlg-head"><h3 id="drTitre">Rue</h3><button class="x" id="drClose" aria-label="Fermer">×</button></div>
  <div class="dlg-body" id="drBody"></div>
  <div class="dlg-foot"><button class="btn" id="drClose2">Fermer</button><button class="btn primary" id="drPassage">Passage fait</button></div>
</dialog>

<button id="fabDictee" class="fab" aria-label="Dicter un passage">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
  <span>Dicter</span>
</button>

<dialog id="dlgDictee">
  <div class="dlg-head"><h3>Dicter un passage</h3><button class="x" id="dictClose" aria-label="Fermer">×</button></div>
  <div class="dlg-body">
    <div class="mic-row">
      <button class="btn primary mic" id="micBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
        <span id="micLabel">Parler</span>
      </button>
      <span class="muted small" id="micEtat"></span>
    </div>
    <p class="muted small" id="micAide" style="margin:0 0 8px"></p>
    <textarea id="dictTexte" rows="3" placeholder="Ex. : « Aujourd'hui équipe A, rue de Tunis, rue Baque et impasse Barthe, beaucoup d'herbe »"></textarea>
    <div id="dictResultat"></div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="dictAnnuler" type="button">Annuler</button>
    <button class="btn primary" id="dictOk" type="button" disabled>Enregistrer</button>
  </div>
</dialog>

<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script src="secteurs.js"></script>
<script src="app.js"></script>
<script src="dictee.js"></script>
</body>
</html>
