<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi désherbage</title>
<meta name="description" content="Suivi des passages de désherbage par rue et prévision de repousse selon la météo.">
<meta name="theme-color" content="#202326">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#efeeea; --surface:#ffffff; --surface2:#f6f5f2; --text:#1c1c1c; --muted:#55575a; --line:#d6d4cd;
  --head:#202326; --head-ink:#ffffff; --head-muted:#b9bdc2;
  --accent:#f2c200; --accent-ink:#1c1c1c; --focus:#1c1c1c;
  --retard:#b3261e; --retard-ink:#ffffff;
  --semaine:#1c1c1c; --quinzaine:#1c1c1c; --ok:#55575a; --inconnu:#8a8c8f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141617; --surface:#1e2124; --surface2:#25292c; --text:#ecebe7; --muted:#a4a8ad; --line:#363a3e;
    --head:#0c0e0f; --head-ink:#ffffff; --head-muted:#9ca1a6;
    --accent:#f2c200; --accent-ink:#1c1c1c; --focus:#f2c200;
    --retard:#e5534b; --retard-ink:#ffffff;
    --semaine:#ecebe7; --quinzaine:#ecebe7; --ok:#a4a8ad; --inconnu:#7d8186;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.n,.kv dd,.resume b{font-variant-numeric:tabular-nums}

/* En-tête */
header.top{background:var(--head);color:var(--head-ink);padding:14px 0 0;position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.top h1{font-size:20px;margin:0;font-weight:700}
.top select{background:transparent;border:0;color:var(--head-muted);font-size:14px;padding:2px 0;cursor:pointer}
.top select option{color:#111}
.pill{margin-left:auto;font-size:13px;color:var(--head-muted);cursor:pointer;white-space:nowrap;text-decoration:underline;text-decoration-color:transparent}
.pill:hover{text-decoration-color:currentColor}
.pill.warn{color:var(--accent);font-weight:700}
nav.tabs{display:flex;gap:2px;margin-top:12px}
nav.tabs button{flex:1;background:none;border:0;color:var(--head-muted);padding:11px 4px;cursor:pointer;white-space:nowrap;font-size:15px}
nav.tabs button[aria-selected="true"]{background:var(--bg);color:var(--text);font-weight:700;border-radius:6px 6px 0 0}

main.wrap{padding-top:14px;padding-bottom:120px}
h2{font-size:15px;font-weight:700;margin:20px 0 8px}
h2 .muted{font-weight:400}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);padding:14px}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--text);padding:12px 14px;margin-bottom:12px}
.notice.warn{border-left-color:var(--accent)}

/* Résumé (3 cases) */
.resume{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.resume button{background:var(--surface);border:1px solid var(--line);padding:10px 12px;text-align:left;cursor:pointer;min-height:64px}
.resume b{display:block;font-size:28px;line-height:1}
.resume span{font-size:13px;color:var(--muted)}
.resume .retard b{color:var(--retard)}
.resume-2{margin:8px 0 0;font-size:14px;color:var(--muted)}
.resume-2 button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit}
.meteo-ligne{margin:10px 0 0;font-size:14px;color:var(--muted)}

/* Listes de rues */
.list{display:flex;flex-direction:column;gap:6px}
.rue{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);padding:12px 14px;min-height:64px;cursor:pointer;text-align:left;width:100%}
.rue:hover{border-color:var(--text)}
.rue .main{flex:1;min-width:0}
.rue .nom{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.rue .meta{font-size:13.5px;color:var(--muted)}
.rue .right{text-align:right;font-size:15px;white-space:nowrap}
.rue .right.semaine{font-weight:700}
.rue .right.inconnu{color:var(--inconnu);font-size:14px}
.rue input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:var(--text)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.04em;padding:3px 7px;background:var(--retard);color:var(--retard-ink);text-transform:uppercase}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:2px 7px;border:1px solid currentColor}
.chip.retard{background:var(--retard);color:var(--retard-ink);border-color:var(--retard)}
.chip.inconnu,.chip.ok{color:var(--muted)}
.classe{display:inline-block;min-width:20px;text-align:center;font-size:12.5px;font-weight:700;padding:0 4px;border:1px solid var(--line);background:var(--surface2)}

/* Barres d'outils, boutons */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{background:var(--surface);border:1px solid var(--line);padding:11px 12px;border-radius:0}
.toolbar input[type=search]{flex:1;min-width:180px}
.btn{background:var(--surface);border:1px solid var(--line);padding:11px 16px;cursor:pointer;font-weight:700;border-radius:0}
.btn:hover{border-color:var(--text)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.danger{color:var(--retard)}
.btn:disabled{opacity:.45;cursor:default}
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:15}
.selbar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.section>summary{cursor:pointer;font-weight:700;font-size:15px;margin:20px 0 8px;list-style-position:inside}

/* Historique */
.hist-day{margin-top:16px}
.hist-day h3{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:700}
.hist-box{border:1px solid var(--line);background:var(--surface)}
.hist-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.hist-item:last-child{border-bottom:0}
.hist-item .grow{flex:1;min-width:0}

/* Formulaires */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.f input,label.f select,label.f textarea{background:var(--surface);border:1px solid var(--line);padding:11px 12px;color:var(--text);font-size:16px;border-radius:0}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px 12px;cursor:pointer;background:var(--surface)}
.radios input{accent-color:var(--text);margin-top:3px;width:18px;height:18px}
.radios label:has(input:checked){border:2px solid var(--text);padding:9px 11px}

/* Fenêtres */
dialog{border:0;padding:0;width:min(560px,calc(100vw - 20px));max-height:calc(100vh - 20px);background:var(--bg);color:var(--text);border-radius:8px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--head);color:var(--head-ink)}
.dlg-head h3{margin:0;font-size:18px;flex:1}
.dlg-head .x{color:var(--head-muted)}
.dlg-body{padding:14px 16px 16px;overflow:auto}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;padding:0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:4px 0 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.settings-grid{grid-template-columns:repeat(2,1fr)}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--head);color:#fff;padding:12px 16px;z-index:50;font-size:15px;text-align:center}
.empty{padding:20px;text-align:center;color:var(--muted)}

/* Bouton Dicter : barre jaune en bas */
.fab{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--bg);border:0;border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));cursor:pointer;display:block;width:100%}
.fab .in{max-width:788px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:2px solid #1c1c1c;padding:15px;font-weight:700;font-size:17px}
.fab svg,.mic svg{width:22px;height:22px;flex:none}
.mic-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.btn.mic{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:2px solid #1c1c1c;padding:12px 18px}
.btn.mic.ecoute{background:var(--retard);border-color:var(--retard);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.75}}
#dictTexte{width:100%;background:var(--surface);border:1px solid var(--line);padding:12px;font-size:16px;resize:vertical;border-radius:0}
.dict-sec{margin-top:14px}
.dict-sec h4{margin:0 0 6px;font-size:15px}
.dict-item{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);margin-bottom:6px;background:var(--surface);cursor:pointer}
.dict-item input{width:24px;height:24px;accent-color:var(--text);flex:none}
.dict-item .grow{flex:1;min-width:0}
.dict-ambi{border:2px dashed var(--muted);padding:8px;margin-bottom:8px}
.dict-ambi p{margin:0 0 6px;font-size:14px;font-weight:700}
.dict-non{font-size:14px;color:var(--retard);font-weight:700}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1>Désherbage</h1>
      <select id="secteur" aria-label="Secteur"></select>
      <span id="meteoPill" class="pill" role="button" tabindex="0" title="Actualiser la météo">Météo…</span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="priorites" aria-selected="true">Priorités</button>
      <button role="tab" data-tab="rues" aria-selected="false">Rues</button>
      <button role="tab" data-tab="historique" aria-selected="false">Historique</button>
      <button role="tab" data-tab="reglages" aria-selected="false">Réglages</button>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>
<div id="selbar" class="selbar" hidden>
  <div class="wrap">
    <strong id="selCount">0 rue</strong>
    <button class="btn" id="selNone">Tout désélectionner</button>
    <button class="btn primary" id="selGo">Saisir un passage</button>
  </div>
</div>

<dialog id="dlgPassage">
  <form method="dialog" id="formPassage">
    <div class="dlg-head"><h3 id="dpTitre">Passage</h3><button class="x" value="cancel" aria-label="Fermer">×</button></div>
    <div class="dlg-body">
      <p class="muted small" id="dpRues"></p>
      <div class="form-grid">
        <label class="f">Date du passage<input type="date" id="dpDate" required></label>
        <label class="f">Équipe / agents<input type="text" id="dpEquipe" placeholder="ex. Équipe A" autocomplete="off"></label>
      </div>
      <p class="small" style="margin:14px 0 6px"><strong>État constaté en arrivant</strong> <span class="muted">(c'est ce qui permet à l'appli d'apprendre)</span></p>
      <div class="radios">
        <label><input type="radio" name="etat" value="propre"><span><strong>Presque propre</strong><br><span class="muted small">On est passé trop tôt</span></span></label>
        <label><input type="radio" name="etat" value="peu"><span><strong>Un peu d'herbe</strong><br><span class="muted small">C'était le bon moment</span></span></label>
        <label><input type="radio" name="etat" value="beaucoup"><span><strong>Beaucoup d'herbe</strong><br><span class="muted small">On est passé trop tard</span></span></label>
        <label><input type="radio" name="etat" value="" checked><span>Non renseigné</span></label>
      </div>
      <label class="f" style="margin-top:12px">Remarque<textarea id="dpRemarque" rows="2" placeholder="facultatif"></textarea></label>
    </div>
    <div class="dlg-foot">
      <button class="btn" value="cancel" formnovalidate>Annuler</button>
      <button class="btn primary" value="ok" id="dpOk">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="dlgRue">
  <div class="dlg-head"><h3 id="drTitre">Rue</h3><button class="x" id="drClose" aria-label="Fermer">×</button></div>
  <div class="dlg-body" id="drBody"></div>
  <div class="dlg-foot"><button class="btn" id="drClose2">Fermer</button><button class="btn primary" id="drPassage">Passage fait</button></div>
</dialog>

<button id="fabDictee" class="fab" aria-label="Dicter un passage"><span class="in">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
  Dicter un passage</span>
</button>

<dialog id="dlgDictee">
  <div class="dlg-head"><h3>Dicter un passage</h3><button class="x" id="dictClose" aria-label="Fermer">×</button></div>
  <div class="dlg-body">
    <div class="mic-row">
      <button class="btn primary mic" id="micBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
        <span id="micLabel">Parler</span>
      </button>
      <span class="muted small" id="micEtat"></span>
    </div>
    <p class="muted small" id="micAide" style="margin:0 0 8px"></p>
    <textarea id="dictTexte" rows="3" placeholder="Ex. : « Aujourd'hui équipe A, rue de Tunis, rue Baque et impasse Barthe, beaucoup d'herbe »"></textarea>
    <div id="dictResultat"></div>
  </div>
  <div class="dlg-foot">
    <button class="btn" id="dictAnnuler" type="button">Annuler</button>
    <button class="btn primary" id="dictOk" type="button" disabled>Enregistrer</button>
  </div>
</dialog>

<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script src="secteurs.js"></script>
<script src="app.js"></script>
<script src="dictee.js"></script>
</body>
</html>
